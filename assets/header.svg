<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" fill="none" role="img" aria-labelledby="headerTitle headerDesc">
  <title id="headerTitle">Nithish S S — Full-Stack Developer &amp; AI System Builder</title>
  <desc id="headerDesc">Precision laser-border command interface with black surface, white-hot typography, and dynamic optical energy path.</desc>

  <defs>
    <!-- Background Technical Grid -->
    <pattern id="laserGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.035"/>
      <circle cx="40" cy="40" r="0.8" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>

    <!-- Subtle Red Ambient Glows behind typography and core -->
    <radialGradient id="redAmbient" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#7F001D" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreAmbient" cx="78%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#7F001D" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#020203" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FF1744"/>
      <stop offset="70%" stop-color="#B00029"/>
      <stop offset="100%" stop-color="#7F001D" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow & Blur Filters -->
    <filter id="laserBlurFast" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
    <filter id="laserCoreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- Definition of Rounded Rectangle Perimeter Path -->
    <!-- Total length ~ 3583px -->
    <path id="laserBorderPath" d="M 26 2 H 1374 A 24 24 0 0 1 1398 26 V 394 A 24 24 0 0 1 1374 418 H 26 A 24 24 0 0 1 2 394 V 26 A 24 24 0 0 1 26 2 Z" />
  </defs>

  <!-- Background Layer -->
  <rect x="2" y="2" width="1396" height="416" rx="24" fill="#030305"/>
  <rect x="2" y="2" width="1396" height="416" rx="24" fill="url(#laserGrid)"/>

  <!-- Ambient Light Reflection -->
  <rect x="2" y="2" width="1396" height="416" rx="24" fill="url(#redAmbient)"/>
  <rect x="2" y="2" width="1396" height="416" rx="24" fill="url(#coreAmbient)"/>

  <!-- =========================================================
       LASER BORDER SYSTEM (3 LAYERS)
       ========================================================= -->

  <!-- LAYER 1: Very thin neutral/dark base border -->
  <use href="#laserBorderPath" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>

  <!-- LAYER 2: Laser trail (thin bright crimson line travelling along perimeter) -->
  <use href="#laserBorderPath" fill="none" stroke="#FF1744" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="280 3303" opacity="0.9" filter="url(#laserCoreGlow)">
    <animate attributeName="stroke-dashoffset" values="0;-3583" dur="6s" repeatCount="indefinite"/>
  </use>

  <!-- LAYER 3: White-Hot Laser Head traveling along the perimeter -->
  <g>
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#laserBorderPath"/>
    </animateMotion>
    <!-- Broad ambient crimson halo -->
    <circle cx="0" cy="0" r="36" fill="#FF003C" opacity="0.2" filter="url(#laserBlurFast)"/>
    <!-- Concentrated laser glow -->
    <circle cx="0" cy="0" r="16" fill="#FF003C" opacity="0.75" filter="url(#laserBlurFast)"/>
    <!-- Intense laser red core -->
    <circle cx="0" cy="0" r="6" fill="#FF1744"/>
    <!-- White-hot inner core -->
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF"/>
  </g>

  <!-- Precision Corner Technical Brackets -->
  <g stroke="#FF1744" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M 22 48 L 22 22 L 48 22" fill="none"/>
    <path d="M 1378 48 L 1378 22 L 1352 22" fill="none"/>
    <path d="M 22 372 L 22 398 L 48 398" fill="none"/>
    <path d="M 1378 372 L 1378 398 L 1352 398" fill="none"/>
  </g>

  <!-- Micro Ticks near corners -->
  <g fill="#9CA3AF" font-family="'Consolas', monospace" font-size="9" letter-spacing="1">
    <text x="56" y="32">SYS.01 // OPTICAL_CORE</text>
    <text x="1344" y="32" text-anchor="end">LOC: 13.0827°N / 80.2707°E</text>
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(68, 70)">
    <!-- White-hot red pulsing beacon -->
    <circle cx="0" cy="0" r="8" fill="#FF003C" opacity="0.3" filter="url(#laserCoreGlow)">
      <animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#FF1744"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
    <text x="16" y="4" fill="#FF1744" font-family="'Consolas', monospace" font-size="12" font-weight="700" letter-spacing="2.5">SYSTEM // NITHISH</text>
  </g>

  <!-- Top Right Telemetry Status Pill -->
  <g transform="translate(1332, 70)" text-anchor="end">
    <rect x="-210" y="-13" width="210" height="26" rx="6" fill="#0C0D12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="-202" y1="-13" x2="-140" y2="-13" stroke="#FF1744" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-194" cy="0" r="3.5" fill="#FF1744" filter="url(#laserCoreGlow)"/>
    <circle cx="-194" cy="0" r="1.5" fill="#FFFFFF"/>
    <text x="-14" y="4" fill="#E5E7EB" font-family="'Consolas', monospace" font-size="11" font-weight="600" letter-spacing="1.5">BUILD // SHIP // ITERATE</text>
  </g>

  <!-- LEFT HERO TYPOGRAPHY -->
  <!-- Name: Strictly WHITE-HOT with crisp high-contrast, illuminated by red ambient laser -->
  <text x="68" y="186" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Syne', sans-serif" font-size="82" font-weight="900" letter-spacing="-2.5">NITHISH S S</text>

  <!-- Laser Red Accent Energy Bar -->
  <rect x="70" y="210" width="130" height="3" rx="1.5" fill="url(#laserBarGrad)"/>
  <rect x="208" y="210" width="16" height="3" rx="1.5" fill="#FF1744"/>
  <circle cx="234" cy="211.5" r="2.5" fill="#FFFFFF" filter="url(#laserCoreGlow)"/>

  <!-- Roles / Engineering Hierarchy -->
  <text x="70" y="254" fill="#E5E7EB" font-family="'Consolas', monospace" font-size="19" font-weight="700" letter-spacing="1.8">
    FULL-STACK DEVELOPER <tspan fill="#FF1744">//</tspan> AI SYSTEM BUILDER
  </text>

  <!-- Value Positioning -->
  <text x="70" y="292" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" letter-spacing="0.2">
    Product thinking. System architecture. High-fidelity web interfaces.
  </text>

  <!-- Bottom Technical Protocol Line -->
  <line x1="70" y1="334" x2="740" y2="334" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
  <line x1="70" y1="334" x2="160" y2="334" stroke="#FF1744" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="334" r="2.5" fill="#FF1744"/>
  <text x="70" y="360" fill="#FF1744" font-family="'Consolas', monospace" font-size="12" font-weight="600" letter-spacing="2">
    INTERFACE <tspan fill="#6B7280">→</tspan> API <tspan fill="#6B7280">→</tspan> INTELLIGENCE <tspan fill="#6B7280">→</tspan> DATA
  </text>

  <!-- =========================================================
       RIGHT SIDE: 3D CYBERNETIC ARCHITECTURE NETWORK (NO BLUE)
       ========================================================= -->
  <g transform="translate(1080, 230)">
    <!-- Ambient Red Core Halo -->
    <circle cx="0" cy="0" r="130" fill="#FF003C" opacity="0.08" filter="url(#laserBlurFast)"/>

    <!-- Concentric Technical Orbital Rings (Neutral & Laser Red) -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#252730" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#FF1744" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="16 6 2 6"/>

    <!-- Radial Axis Coordinate Ticks -->
    <line x1="-160" y1="0" x2="-140" y2="0" stroke="#FF1744" stroke-width="1.2" opacity="0.7"/>
    <line x1="140" y1="0" x2="160" y2="0" stroke="#FF1744" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="-160" x2="0" y2="-140" stroke="#FF1744" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="140" x2="0" y2="160" stroke="#FF1744" stroke-width="1.2" opacity="0.7"/>

    <!-- Neutral Inactive Architecture Beams -->
    <g stroke-width="1.2" stroke-linecap="round">
      <line x1="-95" y1="-65" x2="85" y2="-75" stroke="#30323A"/>
      <line x1="85" y1="-75" x2="125" y2="30" stroke="#30323A"/>
      <line x1="-85" y1="85" x2="-125" y2="-10" stroke="#30323A"/>
      <line x1="-125" y1="-10" x2="-95" y2="-65" stroke="#30323A"/>

      <!-- Cross Structural Struts -->
      <line x1="-95" y1="-65" x2="55" y2="105" stroke="#22242B" stroke-dasharray="2 4"/>
      <line x1="85" y1="-75" x2="-85" y2="85" stroke="#22242B" stroke-dasharray="2 4"/>
      <line x1="-125" y1="-10" x2="125" y2="30" stroke="#22242B" stroke-dasharray="2 4"/>
    </g>

    <!-- ACTIVE LASER DATA PATHS (Energized in Laser Red) -->
    <g stroke-linecap="round">
      <line x1="0" y1="-20" x2="125" y2="30" stroke="#FF1744" stroke-width="2.5" filter="url(#laserCoreGlow)"/>
      <line x1="0" y1="-20" x2="85" y2="-75" stroke="#FF1744" stroke-width="2"/>
      <line x1="0" y1="-20" x2="55" y2="105" stroke="#FF1744" stroke-width="1.8"/>
      <line x1="125" y1="30" x2="55" y2="105" stroke="#FF003C" stroke-width="2"/>
      <line x1="55" y1="105" x2="-85" y2="85" stroke="#B00029" stroke-width="1.5"/>
    </g>

    <!-- Inactive Nodes (Dark Graphite with subtle border) -->
    <circle cx="-95" cy="-65" r="5" fill="#0C0D12" stroke="#4B4D57" stroke-width="1.5"/>
    <circle cx="-125" cy="-10" r="5.5" fill="#0C0D12" stroke="#4B4D57" stroke-width="1.5"/>
    <text x="-160" y="-7" fill="#9CA3AF" font-family="'Consolas', monospace" font-size="10" font-weight="600">APIS</text>

    <circle cx="-85" cy="85" r="5" fill="#0C0D12" stroke="#4B4D57" stroke-width="1.5"/>
    <text x="-124" y="95" fill="#9CA3AF" font-family="'Consolas', monospace" font-size="10" font-weight="600">DATA</text>

    <!-- Active Nodes (White-Hot Center + Laser Red Glow) -->
    <!-- Node: AI -->
    <circle cx="85" cy="-75" r="6" fill="#0C0D12" stroke="#FF1744" stroke-width="2" filter="url(#laserCoreGlow)"/>
    <circle cx="85" cy="-75" r="2.5" fill="#FFFFFF"/>
    <text x="98" y="-78" fill="#FF1744" font-family="'Consolas', monospace" font-size="11" font-weight="700">AI</text>

    <!-- Node: WEB -->
    <circle cx="125" cy="30" r="6.5" fill="#0C0D12" stroke="#FF1744" stroke-width="2.2" filter="url(#laserCoreGlow)"/>
    <circle cx="125" cy="30" r="3" fill="#FFFFFF"/>
    <text x="138" y="34" fill="#FFFFFF" font-family="'Consolas', monospace" font-size="11" font-weight="700">WEB</text>

    <!-- Node: SYSTEMS -->
    <circle cx="55" cy="105" r="5.5" fill="#0C0D12" stroke="#FF1744" stroke-width="1.8"/>
    <circle cx="55" cy="105" r="2.2" fill="#FF6B80"/>
    <text x="68" y="115" fill="#E5E7EB" font-family="'Consolas', monospace" font-size="10.5" font-weight="600">SYSTEMS</text>

    <!-- Central Pulsing Nucleus -->
    <circle cx="0" cy="-20" r="16" fill="#FF003C" opacity="0.35" filter="url(#laserBlurFast)">
      <animate attributeName="r" values="14;18;14" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-20" r="8" fill="#FF1744" filter="url(#laserCoreGlow)"/>
    <circle cx="0" cy="-20" r="3.5" fill="#FFFFFF"/>

    <!-- Orbital Rotation Line -->
    <ellipse cx="0" cy="-20" rx="32" ry="14" fill="none" stroke="#FF1744" stroke-width="1" stroke-dasharray="3 5" transform="rotate(-25, 0, -20)"/>
  </g>
</svg>
