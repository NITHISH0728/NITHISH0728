<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" fill="none" role="img" aria-labelledby="introTitle">
  <title id="introTitle">Turning complex problems into working systems</title>
  <defs>
    <filter id="introLaserGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Container Surface -->
  <rect x="1" y="1" width="898" height="72" rx="14" fill="#050508"/>
  <rect x="1" y="1" width="898" height="72" rx="14" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Precision Corner Tech Ticks -->
  <path d="M 8 18 L 8 8 L 18 8" stroke="#FF1744" stroke-width="1.5" fill="none"/>
  <path d="M 892 18 L 892 8 L 882 8" stroke="#FF1744" stroke-width="1.5" fill="none"/>
  <path d="M 8 56 L 8 66 L 18 66" stroke="#FF1744" stroke-width="1.5" fill="none"/>
  <path d="M 892 56 L 892 66 L 882 66" stroke="#FF1744" stroke-width="1.5" fill="none"/>

  <!-- Main Statement -->
  <text x="450" y="27" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" letter-spacing="2">
    TURNING COMPLEX PROBLEMS <tspan fill="#FF1744">INTO WORKING SYSTEMS</tspan>
  </text>

  <!-- Central Laser Track Line: ━━━━━━━●━━━━ -->
  <line x1="220" y1="41" x2="680" y2="41" stroke="#22242B" stroke-width="1"/>
  <!-- Energized active laser segment -->
  <line x1="410" y1="41" x2="490" y2="41" stroke="#FF1744" stroke-width="1.5" filter="url(#introLaserGlow)">
    <animate attributeName="x1" values="240;600;240" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="320;680;320" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- White-hot traveling laser point -->
  <g>
    <circle cx="450" cy="41" r="5" fill="#FF003C" opacity="0.6" filter="url(#introLaserGlow)">
      <animate attributeName="cx" values="280;640;280" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="41" r="2.5" fill="#FF1744">
      <animate attributeName="cx" values="280;640;280" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="41" r="1.2" fill="#FFFFFF">
      <animate attributeName="cx" values="280;640;280" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Technical Domain Descriptor -->
  <text x="450" y="58" text-anchor="middle" fill="#9CA3AF" font-family="'Consolas', monospace" font-size="10" font-weight="600" letter-spacing="2.5">
    FULL STACK <tspan fill="#FF1744">//</tspan> AI <tspan fill="#FF1744">//</tspan> PRODUCT <tspan fill="#FF1744">//</tspan> SYSTEMS
  </text>
</svg>
