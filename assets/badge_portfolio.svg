<svg xmlns="http://www.w3.org/2000/svg" width="144" height="38" viewBox="0 0 144 38" fill="none">
  <defs>
    <filter id="bLaserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="1" y="1" width="142" height="36" rx="16" fill="#08090D"/>
  <!-- Thin Neutral Base Border -->
  <rect x="1" y="1" width="142" height="36" rx="16" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <!-- Energized Laser Segment along border -->
  <path d="M 16 1 H 56" stroke="#FF1744" stroke-width="1.8" stroke-linecap="round" filter="url(#bLaserGlow)"/>
  <!-- White-Hot Laser Core Point -->
  <circle cx="20" cy="1" r="3" fill="#FF003C" filter="url(#bLaserGlow)"/>
  <circle cx="20" cy="1" r="1.5" fill="#FFFFFF"/>
  <!-- Content -->
  <circle cx="18" cy="19" r="3" fill="#FF1744" filter="url(#bLaserGlow)"/>
  <circle cx="18" cy="19" r="1.2" fill="#FFFFFF"/>
  <text x="32" y="23" fill="#F9FAFB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PORTFOLIO</text>
  <path d="M125 15L130 15M130 15V20M130 15L123 22" stroke="#FF1744" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
