<svg xmlns="http://www.w3.org/2000/svg" width="200" height="44" viewBox="0 0 200 44" fill="none">
  <defs>
    <filter id="btnLaserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
    <path id="btnPath" d="M 16 2 H 184 A 14 14 0 0 1 198 16 V 28 A 14 14 0 0 1 184 42 H 16 A 14 14 0 0 1 2 28 V 16 A 14 14 0 0 1 16 2 Z"/>
  </defs>

  <!-- Ambient Red Halo -->
  <rect x="2" y="2" width="196" height="40" rx="14" fill="#FF003C" opacity="0.14" filter="url(#btnLaserGlow)"/>

  <!-- Dark Surface -->
  <rect x="2" y="2" width="196" height="40" rx="14" fill="#08090D"/>

  <!-- Thin Neutral Base Border -->
  <use href="#btnPath" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>

  <!-- Animated Laser Beam around Button Perimeter -->
  <use href="#btnPath" fill="none" stroke="#FF1744" stroke-width="2" stroke-linecap="round" stroke-dasharray="65 385" filter="url(#btnLaserGlow)">
    <animate attributeName="stroke-dashoffset" values="0;-450" dur="3.5s" repeatCount="indefinite"/>
  </use>

  <!-- White-Hot Laser Core Orb -->
  <g>
    <animateMotion dur="3.5s" repeatCount="indefinite">
      <mpath href="#btnPath"/>
    </animateMotion>
    <circle cx="0" cy="0" r="10" fill="#FF003C" opacity="0.65" filter="url(#btnLaserGlow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#FF1744"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Button Typography -->
  <text x="28" y="27" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">VISIT PORTFOLIO</text>
  <path d="M168 18L174 18M174 18V24M174 18L166 26" stroke="#FF1744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
